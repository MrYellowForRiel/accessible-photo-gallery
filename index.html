</head>

        <figure>

        </figure>
        <figure>
            <img src="anh2.jpg" alt="Mô tả chi tiết ảnh 2">
        </figure>
        <figure>
            <img src="anh3.jpg" alt="Mô tả chi tiết ảnh 3">
        </figure>
        <figure>
            <img src="anh4.jpg" alt="Mô tả chi tiết ảnh 4">
        </figure>
        <figure>
            <img src="anh5.jpg" alt="Mô tả chi tiết ảnh 5">
        </figure>
        <figure>
            <img src="anh6.jpg" alt="Mô tả chi tiết ảnh 6">
        </figure>
    </div>

    <script src="script.js"></script>
</body>
</html>
