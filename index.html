<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bộ Sưu Tập Ảnh Của Tôi</title>
    <style>
        /* CSS để gallery trông đẹp hơn */
        #gallery { display: flex; flex-wrap: wrap; }
        figure { margin: 10px; border: 1px solid #ccc; padding: 5px; }
        img { width: 200px; height: auto; }
    </style>
</head>
<body>

    <h1>Chào mừng đến với thư viện ảnh</h1>
    <h2>Khám phá thế giới qua ống kính</h2>

    <div id="gallery">
        <!-- 6 ảnh với đuôi .png đã sửa -->
        <figure><img src="anh1.png" alt="Mô tả ảnh 1"></figure>
        <figure><img src="anh2.png" alt="Mô tả ảnh 2"></figure>
        <figure><img src="anh3.png" alt="Mô tả ảnh 3"></figure>
        <figure><img src="anh4.png" alt="Mô tả ảnh 4"></figure>
        <figure><img src="anh5.png" alt="Mô tả ảnh 5"></figure>
        <figure><img src="anh6.png" alt="Mô tả ảnh 6"></figure>
    </div>

    <script src="script.js"></script>
</body>
</html>
